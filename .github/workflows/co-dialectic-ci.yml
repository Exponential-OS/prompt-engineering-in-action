name: co-dialectic-ci

on:
  push:
    paths:
      - 'plugins/co-dialectic/**'
      - '.github/workflows/co-dialectic-ci.yml'
      # XOS-314: .githooks/ carries this repo's pre-commit gates, including the leak check
      # that keeps private content out of a PUBLIC repo. It was outside every path filter,
      # so when both gates silently stopped enforcing anything, no CI run noticed.
      - '.githooks/**'
  pull_request:
    paths:
      - 'plugins/co-dialectic/**'
      - '.github/workflows/co-dialectic-ci.yml'
      - '.githooks/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Plugin structure, JSON, SKILL.md, version consistency, marketplace sync
        run: bash test-plugin.sh

      - name: Full install smoke test (install.sh in temp HOME)
        run: bash test-plugin.sh --smoke-install

      - name: install.sh — bare copy sourced from the installed plugin
        run: bash tests/test-install-shadow-source.sh

      # ── XOS-309: the test suite was never in CI at all ──────────────────────
      #
      # This workflow checked plugin structure, version consistency and install smoke
      # tests, and never once ran `bun test`. 250 tests across 14 files, zero of them
      # executed by CI, with no reference to `test:all` anywhere in .github/ or
      # test-plugin.sh.
      #
      # That is not a theoretical gap. XOS-308 changed buildDegradationNudge's text and
      # broke an assertion in tests/xos_141_liveness.test.ts; the PR went green and merged,
      # because CI was not running the thing that would have caught it. A suite nobody runs
      # is the XOS-315 defect with the detection latency set to infinity.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test suite
        working-directory: plugins/co-dialectic
        run: bun run test:all

      - name: The suite must actually have run
        # XOS-309's third acceptance criterion. A file that registers nothing, or a runner
        # that exits before registering, produces no failures -- which is indistinguishable
        # from passing in any log or CI summary. This is the shape that let
        # hooks/xos-197-liveness.test.ts report zero tests while containing 13.
        #
        # The floor is deliberately a real number rather than >0: "at least one test ran"
        # would still pass if 13 of 14 files silently stopped registering. 200 is comfortably
        # below the current 250 and comfortably above any plausible partial-discovery
        # failure, so a collapse trips it while ordinary growth and pruning do not.
        working-directory: plugins/co-dialectic
        run: |
          set -euo pipefail
          out=$(bun run test:all 2>&1 || true)
          echo "$out" | tail -5
          pass=$(printf '%s\n' "$out" | grep -oE '^ *[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          files=$(printf '%s\n' "$out" | grep -oE 'across [0-9]+ files?' | grep -oE '[0-9]+' | head -1)
          if [ -z "${pass:-}" ] || [ -z "${files:-}" ]; then
            echo ""
            # `files?` matters: bun prints "across 1 file." (singular) when discovery
            # collapses to one file. Without it the guard still rejected, but reported "no
            # countable result" instead of "only 11 tests ran" -- a guard that is confidently
            # wrong about WHY it fired sends the reader hunting the wrong thing.
            echo "FAIL: could not read a test count out of the runner's output."
            echo "  A run that produces no countable result is not a green run."
            echo "  FIX: run 'bun run test:all' locally and look at what it actually printed."
            exit 1
          fi
          if [ "$pass" -lt 200 ] || [ "$files" -lt 10 ]; then
            echo ""
            echo "FAIL: only $pass test(s) across $files file(s) ran; expected ~250 across 14."
            echo "  Tests did not fail -- they did not REGISTER. That reads as green"
            echo "  everywhere, which is exactly how this suite went dark before."
            echo "  FIX: run each file individually to find which one stopped registering."
            exit 1
          fi
          echo "OK: $pass tests across $files files actually ran"

      # XOS-314: the pre-commit gates had no CI at all. These two checks are deliberately
      # cheap and deliberately not a full behavioural suite: the hooks call into the cyborg
      # substrate, which does not exist on a CI runner, so their enforcement paths cannot
      # be exercised here. What CAN be checked is that they parse, that they are executable,
      # and that they have not regressed to the warn-and-continue shape this ticket fixed.
      - name: Git hooks parse and are executable
        run: |
          set -euo pipefail
          count=$(find .githooks -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "FAIL: .githooks/ holds no files. This workflow is filtered on that path,"
            echo "so an empty directory means the filter is guarding nothing."
            exit 1
          fi
          find .githooks -maxdepth 1 -type f | while read -r h; do
            echo "checking $h"
            bash -n "$h" || { echo "FAIL: $h is not valid bash"; exit 1; }
            if [ ! -x "$h" ]; then
              echo "FAIL: $h is not executable, so git will silently never run it."
              echo "FIX: chmod +x $h"
              exit 1
            fi
          done
          echo "OK: $count hook(s) parse and are executable"

      - name: Pre-commit hook must not warn-and-continue past a missing gate
        run: |
          set -euo pipefail
          # XOS-314 regression guard. The old hook printed "not found — skipping" and
          # proceeded, which is indistinguishable from a passing gate in commit output.
          # A missing primitive under a PRESENT substrate must BLOCK.
          # Strip comments before matching. The hook's own header QUOTES the old warning
          # text to document what was broken, and an earlier version of this guard failed
          # on that quote. A check that cannot tell description from behaviour is the same
          # defect class it is guarding against.
          if sed 's/#.*//' .githooks/pre-commit \
               | grep -nE 'not found.*skipping|skipping (the )?(leak )?check'; then
            echo ""
            echo "FAIL: the pre-commit hook skips a gate instead of blocking."
            echo "A skipped gate and a passing gate look identical in commit output, and this"
            echo "repo is PUBLIC. A missing primitive under a present substrate must exit 1."
            exit 1
          fi
          # The substrate probe must TEST that a rules/ directory exists, not merely
          # mention the path. ~/cyborg still exists as a stub holding only brain-db/, so a
          # bare -d on the root resolves to a real directory with no rules in it.
          #
          # Deliberately matching the -d TEST, not the string "/rules": the old broken
          # hook also contained "/rules" (inside its wrong hardcoded path), so a substring
          # match passed it. Verified by running both patterns against the old hook from
          # git history before settling on this one.
          if ! grep -qE '\-d "?\$\{?[A-Za-z_]+\}?/rules' .githooks/pre-commit; then
            echo "FAIL: the hook never tests that a rules/ directory EXISTS while resolving"
            echo "the cyborg substrate, so it can resolve the ~/cyborg stub and go dark."
            exit 1
          fi
          echo "OK: no warn-and-continue, and the substrate probe tests for rules/"

